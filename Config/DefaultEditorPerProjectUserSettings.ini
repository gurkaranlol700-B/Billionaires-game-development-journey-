; Project-wide editor defaults. Anyone who opens Seawall gets these, whereas
; Saved/Config/.../EditorPerProjectUserSettings.ini is per-machine and not in git.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; Start Epic's in-editor MCP server automatically, so Claude can drive the
; editor the moment it opens rather than waiting to be switched on by hand.
;
; Safety: this binds to loopback only and has NO authentication. That is fine
; for local development and must never be exposed beyond this machine.
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp

; Tool search on = tools/list returns only list_toolsets, describe_toolset and
; call_tool, and the ~30 toolsets are discovered on demand. Leaving this true:
; registering every toolset tool natively would flood the tool list for no gain.
bEnableToolSearch=True
