[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; --- Lighting -------------------------------------------------------------
; Lumen gives us real-time global illumination and reflections. For a game set
; inside dark concrete rooms lit by a single torch, GI is most of the look --
; light bouncing off wet walls is what stops it feeling like a flat cutout.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

; --- Geometry -------------------------------------------------------------
; Nanite lets us drop in Megascans scans at full density without worrying
; about triangle budgets, which is exactly how we get photoreal concrete cheaply.
r.Nanite.ProjectEnabled=True

; Virtual shadow maps -- required for Nanite to cast decent shadows, and the
; reason a torch beam across rubble reads correctly.
r.Shadow.Virtual.Enable=1

; --- Anti-aliasing --------------------------------------------------------
; TSR is UE5's temporal upscaler. On a 5060 Ti this is what buys us headroom
; to render at less than native and still look sharp at 1080p/1440p.
r.AntiAliasingMethod=4

; --- Post ----------------------------------------------------------------
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True

; Extended luminance range -- needed for believable darkness, so an unlit
; corridor can actually be dark rather than washed-out grey.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
; Sub-stepping keeps thrown objects (every one of which makes noise) stable.
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

[/Script/Engine.CollisionProfile]
; Custom trace channel for line-of-sight checks that should ignore things the
; player can see through but not walk through (railings, grates, debris).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Visibility_AI")
