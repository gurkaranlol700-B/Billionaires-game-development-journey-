[/Script/Engine.AssetManagerSettings]
; The GameFeatures plugin is enabled (it comes in as a dependency of the
; toolsets), and it insists the Asset Manager knows how to find GameFeatureData
; assets. Without this rule the editor throws a diagnostics popup on every load.
;
; We do not actually use Game Features, so this points at an empty directory
; and is marked NeverCook -- it exists purely to satisfy the check.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=NeverCook))

