[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Seawall
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "SEAWALL")
Description=First-person survival horror on Kurogane-jima.
